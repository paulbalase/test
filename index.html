<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Invited!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #71b48d, #a2d6b3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 90%;
        }
        button {
            background: #2e8b57;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover { background: #3cb371; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 You're Invited!</h1>
        <p>Join us for a special celebration in Cagayan De Oro City!</p>
        <p><strong>When:</strong> Saturday, June 13, 2026</p>
        <p><strong>Where:</strong> Limketkai Center, CDO</p>
        <button onclick="alert('RSVP Confirmed! See you there!')">RSVP Now</button>
    </div>

</body>
</html>
